# Tool registry for verl's ToolAgentLoop
# (actor_rollout_ref.rollout.multi_turn.tool_config_path points here).
# tool_schema is omitted on purpose: CropVideoTool.get_openai_tool_schema()
# is the single source of truth, shared with the Step-0 probe.
tools:
  - class_name: agentic_tvg.crop_video_tool.CropVideoTool
    config:
      type: native
      num_frames: 16
      max_pixels: 150528
      min_pixels: 3136
      min_crop_seconds: 2.0
